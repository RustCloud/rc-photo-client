<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="photo2-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D94821"/>
      <stop offset="100%" stop-color="#7D1806"/>
    </linearGradient>

    <linearGradient id="photo2-front" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C"/>
      <stop offset="50%" stop-color="#E85325"/>
      <stop offset="100%" stop-color="#B02A10"/>
    </linearGradient>

    <linearGradient id="photo2-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A1105"/>
      <stop offset="100%" stop-color="#8A240C"/>
    </linearGradient>

    <g id="card-back-geo" transform="rotate(-11, 130, 130)">
      <rect x="44" y="54" width="160" height="144" rx="20"/>
    </g>

    <g id="card-front-geo" transform="rotate(6, 150, 140)">
      <rect x="68" y="66" width="164" height="148" rx="20"/>
    </g>
  </defs>

  <g transform="translate(0, 14) scale(1.828)">
    <!-- Обводка задней карточки -->
    <use href="#card-back-geo" stroke="#330A02" stroke-width="5.5" stroke-linejoin="round" fill="none"/>
    <use href="#card-back-geo" fill="url(#photo2-back)"/>

    <!-- Обводка и заливка передней карточки -->
    <use href="#card-front-geo" stroke="#330A02" stroke-width="5.5" stroke-linejoin="round" fill="none"/>
    <use href="#card-front-geo" fill="url(#photo2-front)"/>

    <!-- Внутренняя область снимка -->
    <g transform="rotate(6, 150, 140)">
      <rect x="82" y="80" width="136" height="104" rx="11" fill="url(#photo2-sky)" stroke="#330A02" stroke-width="3"/>

      <!-- Солнце-шестеренка внутри кадра -->
      <g transform="translate(178, 112)" fill="#FFA24C" stroke="#330A02" stroke-width="2" stroke-linejoin="round">
        <circle r="13"/>
        <rect x="-2.5" y="-18" width="5" height="6" rx="1" transform="rotate(0)"/>
        <rect x="-2.5" y="-18" width="5" height="6" rx="1" transform="rotate(60)"/>
        <rect x="-2.5" y="-18" width="5" height="6" rx="1" transform="rotate(120)"/>
        <rect x="-2.5" y="-18" width="5" height="6" rx="1" transform="rotate(180)"/>
        <rect x="-2.5" y="-18" width="5" height="6" rx="1" transform="rotate(240)"/>
        <rect x="-2.5" y="-18" width="5" height="6" rx="1" transform="rotate(300)"/>
        <circle r="5" fill="#4A1105"/>
      </g>

      <!-- Горы на снимке -->
      <path d="M 84 182 L 124 126 L 156 164 L 176 142 L 216 182 Z" fill="url(#photo2-front)" stroke="#330A02" stroke-width="3" stroke-linejoin="round"/>

      <!-- Световые блики -->
      <g fill="none" stroke="#FFE7BA" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <path d="M 75 94 L 75 82 C 75 76 79 73 85 73 L 106 73"/>
        <line x1="120" y1="138" x2="112" y2="150"/>
      </g>
    </g>
  </g>
</svg>

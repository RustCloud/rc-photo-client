name: Release

# A v* tag (v0.1.0, v0.2.0-beta.1) builds the Android app and publishes a GitHub
# release with the APK and SHA256SUMS; a tag with "-" is a pre-release. The tag
# must match the version in pubspec.yaml (the part before "+").
# Started by hand (Actions → Release → Run workflow) or by a push to the
# release-check branch, it only builds: the APK is in the run's artifacts.
#
# The APK is signed with the organisation's key, the same as the RustCloud
# client's (so the client's phone account gives this app a token without
# asking): secrets ANDROID_KEYSTORE (base64 of a .jks), ANDROID_KEYSTORE_PASSWORD
# and ANDROID_KEY_ALIAS. Without them a throwaway key is made for the run: the
# APK installs, but cannot update one signed by another key.

on:
  push:
    tags: ["v*"]
    branches: [release-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          version=$(grep -m1 '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pubspec.yaml"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Same Flutter as CI and buildserver (tools/buildserver-ci.sh).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$ks"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signed with a throwaway key, the APK cannot update an installed one"
            KEYSTORE_PASSWORD=$(openssl rand -hex 16) KEY_ALIAS=rustcloud
            keytool -genkeypair -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=RustCloud" >/dev/null
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          {
            echo "ANDROID_KEYSTORE_FILE=$ks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # One APK for phones (arm64, arm) and emulators (x86_64).
      - name: Build
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release 2>&1 | tee build.log || {
            # The log's end in one annotation: readable on the run's page without logging in.
            echo "::error title=Build::$(grep -v '^\s*$' build.log | tail -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
            exit 1
          }

      - name: Check the signature
        run: |
          tools=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          mkdir -p out
          apk="out/RustCloudPhotos_${{ steps.version.outputs.version }}_android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          # The certificate on the run's page, to compare with the client's APK.
          echo "::notice title=Signing certificate::$(grep -m1 'SHA-256' certs.txt)"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "RustCloud Photos $GITHUB_REF_NAME" --generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" out/*

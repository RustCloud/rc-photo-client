name: rc_photo
description: "Photos for RustCloud: gallery and phone backup over the rc-photo plugin."
publish_to: 'none'
version: 0.4.0-alpha.3+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.9.0
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  # The backup's state of every photo, and its log.
  sqflite: ^2.4.2
  path: ^1.9.1
  # Videos of the timeline (ExoPlayer on Android).
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # sqflite on the computer, for tests of the backup's database.
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
